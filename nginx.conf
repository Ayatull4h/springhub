events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Brotli compression (if module installed)
  # brotli on;
  # brotli_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
  gzip_min_length 256;
  gzip_comp_level 6;
  gzip_vary on;

  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  upstream nextjs {
    server web:3000;
  }

  server {
    listen 80;
    server_name springhub.id www.springhub.id;
    return 301 https://$server_name$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name springhub.id www.springhub.id;

    # SSL (via Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/springhub.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/springhub.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static file caching
    location /_next/static {
      proxy_pass http://nextjs;
      proxy_cache STATIC;
      proxy_cache_valid 200 365d;
      proxy_cache_use_stale error timeout updating;
      add_header Cache-Control "public, immutable, max-age=31536000";
    }

    location /api {
      limit_req zone=api burst=10 nodelay;
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
