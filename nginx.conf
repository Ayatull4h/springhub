events {
  worker_connections 2048;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  # ── Security: Sembunyikan versi nginx ──
  server_tokens off;

  # ── Security: Timeouts & buffer overflow protection ──
  client_body_timeout   10s;
  client_header_timeout 10s;
  send_timeout          10s;
  keepalive_timeout     65;
  keepalive_requests    100;
  client_max_body_size  20M;
  client_body_buffer_size       128k;
  client_header_buffer_size     1k;
  large_client_header_buffers   4 8k;

  # ── Security: Cegah IP spoof / open proxy ──
  underscores_in_headers off;

  # Open file cache
  open_file_cache max=1000 inactive=20s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml text/javascript image/svg+xml
             image/webp image/jpeg image/png;
  gzip_min_length 256;
  gzip_comp_level 6;
  gzip_vary on;
  gzip_proxied any;

  # ═══════════════════════════════════════════════════════════════
  # RATE LIMITING ZONES
  # ═══════════════════════════════════════════════════════════════
  limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/s;
  limit_req_zone $binary_remote_addr zone=donate:10m  rate=3r/s;
  limit_req_zone $binary_remote_addr zone=newsletter:10m rate=2r/m;
  limit_req_zone $binary_remote_addr zone=report:10m  rate=1r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # Cache zone for static files
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m
                   inactive=365d max_size=1g;

  upstream nextjs {
    server web:31759;
    keepalive 64;
  }

  # ── Cloudflare Real IP (biar rate limiter pake IP asli visitor, bukan IP Cloudflare) ──
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # ── SSL settings ────────────────────────────────────────────
  ssl_certificate /etc/letsencrypt/live/www.springhub.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.springhub.id/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1h;
  ssl_session_tickets off;
  ssl_buffer_size 4k;

  # ═══════════════════════════════════════════════════════════════
  # CATCH-ALL: Akses via IP langsung (76.13.198.18)
  # ═══════════════════════════════════════════════════════════════
  server {
    listen 80;
    server_name _;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(self), microphone=()" always;

    # Uploaded files — langsung dari disk
    location /uploads/ {
      alias /data/uploads/;
      expires 365d;
      add_header Cache-Control "public, immutable, max-age=31536000";
      access_log off;
      autoindex off;
    }

    # Next.js static files
    location /_next/static {
      proxy_pass http://nextjs;
      proxy_cache STATIC;
      proxy_cache_valid 200 365d;
      proxy_cache_use_stale error timeout updating;
      add_header Cache-Control "public, immutable, max-age=31536000";
      access_log off;
    }

    # API routes
    location /api {
      limit_req zone=api burst=20 nodelay;
      limit_conn conn_limit 10;
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      proxy_connect_timeout 10s;
    }

    # All other routes
    location / {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
    }
  }

  # ═══════════════════════════════════════════════════════════════
  # DOMAIN: springhub.id / www.springhub.id
  # ═══════════════════════════════════════════════════════════════

  # HTTP → HTTPS redirect
  server {
    listen 80;
    server_name springhub.id www.springhub.id;
    return 301 https://www.springhub.id$request_uri;
  }

  # HTTPS → serve
  server {
    listen 443 ssl;
    http2 on;
    server_name springhub.id www.springhub.id;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(self), microphone=()" always;
    # CSP diatur di next.config.mjs — hanya satu sumber kebenaran

    # Uploaded files
    location /uploads/ {
      alias /data/uploads/;
      expires 365d;
      add_header Cache-Control "public, immutable, max-age=31536000";
      access_log off;
      autoindex off;
    }

    # Next.js static files
    location /_next/static {
      proxy_pass http://nextjs;
      proxy_cache STATIC;
      proxy_cache_valid 200 365d;
      proxy_cache_use_stale error timeout updating;
      add_header Cache-Control "public, immutable, max-age=31536000";
      access_log off;
    }

    # API routes — strict rate limiting per endpoint
    location /api/auth/login {
      limit_req zone=auth burst=3 nodelay;
      limit_conn conn_limit 5;
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    location /api/auth/register {
      limit_req zone=auth burst=2 nodelay;
      limit_conn conn_limit 3;
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    location /api/donations/invoice {
      limit_req zone=donate burst=2 nodelay;
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    location /api/reports {
      limit_req zone=report burst=3 nodelay;
      limit_conn conn_limit 5;
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location /api/newsletter {
      limit_req zone=newsletter burst=1 nodelay;
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 10s;
    }

    # Generic API routes (non-sensitive)
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      limit_conn conn_limit 10;
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      proxy_connect_timeout 10s;
    }

    # Admin routes — restricted by IP & rate
    location /api/admin/ {
      limit_req zone=api burst=10 nodelay;
      limit_conn conn_limit 5;
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      proxy_connect_timeout 10s;
    }

    # Admin pages (non-API)
    location /admin {
      limit_req zone=api burst=10 nodelay;
      limit_conn conn_limit 5;
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
    }

    # All other routes
    location / {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
    }
  }
}
