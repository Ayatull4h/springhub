<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibitku — SpringHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
.container { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
h1 { display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem; }
h1 span { color: #059669; }

.listing-group { background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1.5rem; }
.group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
.group-header h3 { font-weight: 600; }
.group-header .muted { font-size: 0.75rem; color: #64748b; margin-top: 0.125rem; }
.badge { padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; background: #ecfdf5; color: #059669; }

.empty-req { text-align: center; padding: 1rem 0; color: #94a3b8; font-size: 0.875rem; border-top: 1px solid #f1f5f9; }

/* Request item */
.req-item { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; padding: 0.75rem 0; border-top: 1px solid #f1f5f9; }
.req-item:first-of-type { border-top: 1px solid #e2e8f0; }
.req-main { flex: 1; min-width: 200px; }
.req-top { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.req-top .name { font-weight: 500; }
.req-top .detail { color: #64748b; font-size: 0.875rem; }
.req-message { color: #64748b; font-size: 0.75rem; font-style: italic; margin-top: 0.125rem; }
.req-date { font-size: 0.625rem; color: #94a3b8; margin-top: 0.125rem; }

.chip { padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
.chip-pending { background: #fef3c7; color: #d97706; }
.chip-approved { background: #d1fae5; color: #059669; }
.chip-fulfilled { background: #dbeafe; color: #2563eb; }
.chip-rejected { background: #fee2e2; color: #dc2626; }

.btn-group { display: flex; gap: 0.5rem; }
.btn-sm {
  padding: 0.25rem 0.75rem; border-radius: 0.5rem; font-size: 0.75rem;
  border: none; cursor: pointer; transition: background 0.2s;
  display: inline-flex; align-items: center; gap: 0.25rem;
}
.btn-approve { background: #059669; color: white; }
.btn-approve:hover { background: #047857; }
.btn-reject { border: 1px solid #fecaca; color: #dc2626; background: none; }
.btn-reject:hover { background: #fef2f2; }
.btn-fulfill { background: #2563eb; color: white; }
.btn-fulfill:hover { background: #1d4ed8; }
</style>
</head>
<body>
<div class="container">
  <h1><span>🌱</span> Bibitku</h1>

  <div id="listingsContainer"></div>
</div>

<script>
const DATA = [
  {
    id: 1, species: "Jati", count: 50,
    requests: [
      { id: "r1", from: "Budi", qty: 10, message: "Mau tanam di kebun", status: "pending", date: "2 hari lalu" },
      { id: "r2", from: "Sari", qty: 5, message: "Buat penghijauan RT", status: "approved", date: "1 hari lalu" },
      { id: "r3", from: "Doni", qty: 3, message: "Bibit buat kelompok tani", status: "fulfilled", date: "5 hari lalu" },
    ]
  },
  {
    id: 2, species: "Bambu Petung", count: 30,
    requests: [
      { id: "r4", from: "Rudi", qty: 8, message: "Mau nanam di pinggir sungai", status: "pending", date: "3 hari lalu" },
    ]
  },
  {
    id: 3, species: "Mahoni", count: 100,
    requests: []
  }
];

const CHIP = {
  pending:   'chip-pending',
  approved:  'chip-approved',
  fulfilled: 'chip-fulfilled',
  rejected:  'chip-rejected',
};
const LABEL = {
  pending:   'Menunggu',
  approved:  'Disetujui',
  fulfilled: 'Selesai',
  rejected:  'Ditolak',
};

function render() {
  const container = document.getElementById('listingsContainer');
  container.innerHTML = DATA.map(listing => {
    const count = listing.requests.length;
    const requestsHtml = count === 0
      ? `<div class="empty-req">Belum ada permintaan untuk bibit ini</div>`
      : listing.requests.map(r => {
          let actions = '';
          if (r.status === 'pending') {
            actions = `<div class="btn-group">
              <button class="btn-sm btn-approve" onclick="alert('Disetujui (demo)')">✅ Setujui</button>
              <button class="btn-sm btn-reject" onclick="alert('Ditolak (demo)')">❌ Tolak</button>
            </div>`;
          } else if (r.status === 'approved') {
            actions = `<button class="btn-sm btn-fulfill" onclick="alert('Selesai (demo)')">✅ Tandai Selesai</button>`;
          }
          return `
            <div class="req-item">
              <div class="req-main">
                <div class="req-top">
                  <span class="name">${r.from}</span>
                  <span class="detail">minta ${r.qty} bibit</span>
                  <span class="chip ${CHIP[r.status]}">${LABEL[r.status]}</span>
                </div>
                ${r.message ? `<div class="req-message">"${r.message}"</div>` : ''}
                <div class="req-date">${r.date}</div>
              </div>
              <div class="actions">${actions}</div>
            </div>
          `;
        }).join('');

    return `
      <div class="listing-group">
        <div class="group-header">
          <div>
            <h3>${listing.species}</h3>
            <div class="muted">${listing.count} bibit dilaporkan</div>
          </div>
          <span class="badge">${count} permintaan</span>
        </div>
        ${requestsHtml}
      </div>
    `;
  }).join('');
}

render();
</script>
</body>
</html>
