<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permintaanku — SpringHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
.container { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
h1 { display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem; }
h1 span { color: #059669; }

.list { display: flex; flex-direction: column; gap: 0.75rem; }
.item {
  display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;
  background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem;
  padding: 1rem; transition: border-color 0.2s;
}
.item:hover { border-color: #d1d5db; }
.item-main { flex: 1; min-width: 200px; }
.item-top { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.item-top strong { font-weight: 600; }
.item-muted { color: #64748b; font-size: 0.875rem; }
.item-sub {
  font-size: 0.75rem; color: #64748b; margin-top: 0.25rem;
}

/* Status chip */
.chip { padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
.chip-pending { background: #fef3c7; color: #d97706; }
.chip-approved { background: #d1fae5; color: #059669; }
.chip-rejected { background: #fee2e2; color: #dc2626; }
.chip-fulfilled { background: #dbeafe; color: #2563eb; }
.chip-cancelled { background: #f1f5f9; color: #64748b; }

.item-actions { display: flex; align-items: center; gap: 0.5rem; }
.btn-cancel {
  border: 1px solid #fecaca; background: none; color: #dc2626;
  padding: 0.25rem 0.75rem; border-radius: 0.5rem; font-size: 0.75rem; cursor: pointer;
}
.btn-cancel:hover { background: #fef2f2; }
.phone-num { font-size: 0.875rem; color: #64748b; }
.btn-call {
  background: #059669; color: white; border: none;
  padding: 0.25rem 0.75rem; border-radius: 0.5rem; font-size: 0.75rem; cursor: pointer;
}
.btn-call:hover { background: #047857; }
</style>
</head>
<body>
<div class="container">
  <h1><span>📋</span> Permintaanku</h1>

  <div class="list" id="requestList"></div>
</div>

<script>
const DATA = [
  { id: 1, species: "Jati", qty: 10, owner: "Asep", location: "Bandung", status: "pending", date: "2 hari lalu" },
  { id: 2, species: "Bambu Petung", qty: 5, owner: "Sari", location: "Bogor", status: "approved", date: "1 hari lalu", phone: "0812-3456-7890" },
  { id: 3, species: "Mahoni", qty: 2, owner: "Budi", location: "Garut", status: "rejected", date: "3 hari lalu" },
  { id: 4, species: "Sengon", qty: 15, owner: "Dewi", location: "Malang", status: "fulfilled", date: "5 hari lalu" },
  { id: 5, species: "Kaliandra", qty: 20, owner: "Rina", location: "Banyuwangi", status: "cancelled", date: "7 hari lalu" },
];

const CHIP = {
  pending:   'chip-pending',
  approved:  'chip-approved',
  rejected:  'chip-rejected',
  fulfilled: 'chip-fulfilled',
  cancelled: 'chip-cancelled',
};

const LABEL = {
  pending:   'Menunggu',
  approved:  'Disetujui',
  rejected:  'Ditolak',
  fulfilled: 'Selesai',
  cancelled: 'Dibatalkan',
};

function render() {
  const list = document.getElementById('requestList');
  list.innerHTML = DATA.map(r => {
    let actions = '';
    if (r.status === 'pending') {
      actions = `<button class="btn-cancel" onclick="alert('Permintaan dibatalkan (demo)')">Batalkan</button>`;
    } else if (r.status === 'approved') {
      actions = `<span class="phone-num">📞 ${r.phone}</span>
                 <a href="tel:${r.phone}" class="btn-call">Hubungi</a>`;
    }
    return `
      <div class="item">
        <div class="item-main">
          <div class="item-top">
            <strong>${r.species}</strong>
            <span class="item-muted">— ${r.qty} bibit</span>
            <span class="chip ${CHIP[r.status]}">${LABEL[r.status]}</span>
          </div>
          <div class="item-sub">Dari ${r.owner} · ${r.location} · ${r.date}</div>
        </div>
        <div class="item-actions">${actions}</div>
      </div>
    `;
  }).join('');
}

render();
</script>
</body>
</html>
