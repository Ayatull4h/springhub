<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibit Tersedia — SpringHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
.container { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; }
.header { margin-bottom: 1.5rem; }
.header h1 { display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 800; }
.header h1 .accent { color: #059669; }
.header p { margin-top: 0.25rem; color: #64748b; font-size: 0.875rem; }
.nav-links { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.nav-links a {
  display: inline-flex; align-items: center; gap: 0.375rem;
  padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem;
  text-decoration: none; font-weight: 500; transition: all 0.2s;
}
.nav-link-main { background: #059669; color: white; }
.nav-link-main:hover { background: #047857; }
.nav-link-secondary { background: white; border: 1px solid #e2e8f0; color: #1e293b; }
.nav-link-secondary:hover { border-color: #059669; }

.filter-bar { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.5rem; }
.search-box { position: relative; flex: 1; min-width: 200px; }
.search-box input {
  width: 100%; padding: 0.5rem 0.75rem 0.5rem 2.25rem;
  border: 1px solid #e2e8f0; border-radius: 0.5rem; font-size: 0.875rem;
  background: white; outline: none;
}
.search-box input:focus { border-color: #059669; box-shadow: 0 0 0 3px rgba(5,150,105,0.1); }
.search-box .icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 1rem; }
.filter-bar select {
  padding: 0.5rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem;
  font-size: 0.875rem; background: white; outline: none; cursor: pointer;
}
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.card {
  background: white; border-radius: 0.75rem; border: 1px solid #e2e8f0;
  overflow: hidden; transition: border-color 0.2s; text-decoration: none; color: inherit;
  display: block;
}
.card:hover { border-color: #059669; }
.photo-placeholder {
  aspect-ratio: 16/9; background: #f1f5f9; display: flex; align-items: center;
  justify-content: center; color: #94a3b8; font-size: 0.875rem;
}
.card-body { padding: 1rem; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; }
.card-top h3 { font-size: 1.125rem; font-weight: 600; }
.badge-green { padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; background: #ecfdf5; color: #059669; white-space: nowrap; }
.location { display: flex; align-items: center; gap: 0.25rem; color: #64748b; font-size: 0.875rem; margin-top: 0.5rem; }
.card-footer {
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid #f1f5f9; margin-top: 0.5rem; padding-top: 0.5rem;
}
.owner-info { font-size: 0.875rem; color: #64748b; }
.request-link { font-size: 0.75rem; font-weight: 500; color: #059669; }
.empty-state { text-align: center; padding: 4rem 0; color: #64748b; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><span class="accent">🌱</span> Bibit Tersedia</h1>
    <p>Cari dan minta bibit dari komunitas SpringHub</p>
  </div>

  <div class="nav-links">
    <a href="index.html" class="nav-link-main">🌱 Marketplace Bibit</a>
    <a href="my-listings.html" class="nav-link-secondary">📋 Bibitku</a>
    <a href="my-requests.html" class="nav-link-secondary">📨 Permintaanku</a>
  </div>

  <div class="filter-bar">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Cari jenis bibit..." oninput="filterCards()">
    </div>
    <select id="provinceFilter" onchange="filterCards()">
      <option value="">Semua Provinsi</option>
      <option>Jawa Barat</option><option>Jawa Tengah</option><option>Jawa Timur</option>
      <option>Banten</option><option>Sumatera Utara</option><option>Sumatera Barat</option>
      <option>Sumatera Selatan</option><option>Lampung</option><option>Bali</option>
      <option>Nusa Tenggara Barat</option><option>Nusa Tenggara Timur</option>
      <option>Sulawesi Selatan</option><option>Kalimantan Barat</option>
      <option>Kalimantan Timur</option><option>Kalimantan Selatan</option><option>Papua</option>
    </select>
  </div>

  <div class="grid" id="seedlingGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none">Tidak ada bibit ditemukan</div>
</div>

<script>
const DATA = [
  { id: 1, species: "Jati", count: 50, province: "Jawa Barat", regency: "Bandung", owner: "Asep", trust: 85 },
  { id: 2, species: "Bambu Petung", count: 30, province: "Jawa Barat", regency: "Bogor", owner: "Sari", trust: 92 },
  { id: 3, species: "Mahoni", count: 100, province: "Jawa Barat", regency: "Garut", owner: "Budi", trust: 78 },
  { id: 4, species: "Sengon", count: 25, province: "Jawa Timur", regency: "Malang", owner: "Dewi", trust: 88 },
  { id: 5, species: "Suren", count: 40, province: "Jawa Tengah", regency: "Solo", owner: "Joko", trust: 90 },
  { id: 6, species: "Kaliandra", count: 200, province: "Jawa Timur", regency: "Banyuwangi", owner: "Rina", trust: 95 },
  { id: 7, species: "Acacia", count: 75, province: "Jawa Barat", regency: "Sukabumi", owner: "Agus", trust: 82 },
  { id: 8, species: "Albasia", count: 60, province: "Jawa Tengah", regency: "Semarang", owner: "Fitri", trust: 87 },
  { id: 9, species: "Gamal", count: 150, province: "Banten", regency: "Pandeglang", owner: "Ujang", trust: 80 },
  { id: 10, species: "Saga", count: 35, province: "Bali", regency: "Tabanan", owner: "Nyoman", trust: 91 },
];

function renderCards(list) {
  const grid = document.getElementById('seedlingGrid');
  const empty = document.getElementById('emptyState');
  if (list.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = list.map(s => `
    <a href="detail.html?id=${s.id}" class="card">
      <div class="photo-placeholder">📷 Foto Bibit</div>
      <div class="card-body">
        <div class="card-top">
          <h3>${s.species}</h3>
          <span class="badge-green">${s.count} bibit</span>
        </div>
        <div class="location">📍 ${s.regency}, ${s.province}</div>
        <div class="card-footer">
          <span class="owner-info">👤 ${s.owner} · ⭐ ${s.trust}</span>
          <span class="request-link">Minta &rarr;</span>
        </div>
      </div>
    </a>
  `).join('');
}

function filterCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const p = document.getElementById('provinceFilter').value;
  renderCards(DATA.filter(s => (!p || s.province === p) && (!q || s.species.toLowerCase().includes(q))));
}

renderCards(DATA);
</script>
</body>
</html>
