# SpringHub STAGING — berjalan PARALEL dengan produksi di VPS yang sama.
# Produksi (docker-compose.yml) TIDAK disentuh. Semua port host dibedakan.
# Jalankan: docker compose --env-file .env.staging -p staging -f docker-compose.staging.yml up -d --build
# Data: DB springhub_staging (port 5433), Redis DB 1 (port 6380), uploads_staging_data.

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    container_name: staging-postgres
    environment:
      POSTGRES_USER: springhub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum di-set di .env.staging}
      POSTGRES_DB: springhub_staging
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "idle_in_transaction_session_timeout=30000"
      - "-c"
      - "statement_timeout=30000"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springhub -d springhub_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: staging-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD belum di-set}
    volumes:
      - redis_staging_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: staging-web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.staging
    environment:
      DATABASE_URL: "postgresql://springhub:${DB_PASSWORD}@postgres:5432/springhub_staging?connection_limit=5&pool_timeout=10"
      REDIS_URL: "redis://default:${REDIS_PASSWORD}@redis:6379/1"
      REDIS_QUEUE_URL: "redis://default:${REDIS_PASSWORD}@redis:6379/1"
      UPLOAD_DIR: "/data/uploads"
      UPLOAD_URL_PREFIX: "/uploads"
      PORT: "31760"
    ports:
      - "127.0.0.1:31760:31760"
    volumes:
      - uploads_staging_data:/data/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:31760/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  worker:
    image: springhub-staging-web:latest
    restart: unless-stopped
    container_name: staging-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    env_file:
      - .env.staging
    environment:
      REDIS_URL: "redis://default:${REDIS_PASSWORD}@redis:6379/1"
      REDIS_QUEUE_URL: "redis://default:${REDIS_PASSWORD}@redis:6379/1"
    command: sh -c "npx tsx workers/email-worker.ts & npx tsx workers/image-worker.ts; wait"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    container_name: staging-nginx
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./nginx-staging.conf:/etc/nginx/nginx.conf:ro
      - ./scripts/htpasswd-staging:/etc/nginx/htpasswd-staging:ro
      - ./scripts/htpasswd-preview:/etc/nginx/htpasswd-preview:ro
      - uploads_staging_data:/data/uploads:ro
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_staging_data:
  redis_staging_data:
  uploads_staging_data:
